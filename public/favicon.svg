<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="ตำหนักผู่โถวเจ้าแม่กวนอิม">
  <!-- ตราศาลาชุดเดียวกับหัวเว็บ แต่ถอดวงตราออกและเพิ่มความหนาเส้น
       ที่ ๑๖ px วงตราจะกลายเป็นก้อนกลมทึบและกลืนตัวอาคารจนไม่เหลืออะไร

       ไล่เฉดทองต้องเป็น userSpaceOnUse — ค่าปริยายคิดจากกรอบของเส้นแต่ละเส้น
       เส้นแนวนอนล้วนจะมีกรอบสูงศูนย์ แล้วเบราว์เซอร์จะไม่วาดเส้นนั้นเลย -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A1015"/><stop offset="100%" stop-color="#0F0608"/>
    </linearGradient>
    <linearGradient id="foil" x1="6" y1="6" x2="90" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B98E2C"/><stop offset="24%" stop-color="#D8A93F"/>
      <stop offset="42%" stop-color="#FBF3C4"/><stop offset="62%" stop-color="#C99B34"/>
      <stop offset="82%" stop-color="#F2DCA6"/><stop offset="100%" stop-color="#C08F26"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="11" fill="url(#bg)"/>
  <g fill="none" stroke="url(#foil)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="16.5" r="3" stroke-width="3"/>
    <path d="M10 33.5q5.5 5.6 13.5 4.8Q33 34 48 29Q63 34 72.5 38.3q8 .8 13.5-4.8" stroke-width="4.4"/>
    <path d="M33 45.5h30v11H33z" stroke-width="3.6"/>
    <path d="M17 61.5h62" stroke-width="3.6"/>
    <path d="M17 61.5v20M79 61.5v20" stroke-width="3.6"/>
    <path d="M41 67h14v14.5H41z" stroke-width="3.6"/>
    <path d="M12 85h72" stroke-width="3.4"/>
  </g>
</svg>
