# ๘ หมวดพร — เป็นทั้งตัวกรองบนหน้ารวม และหน้าเว็บของตัวเอง (/wish/{slug})
# การจับคู่ปางกับพรอยู่ในฟิลด์ wishes ของแต่ละปาง ไม่ใช่ที่นี่
- id: health
  order: 1
  title: สุขภาพ · หายป่วย
  short: สุขภาพ
  lede: สำหรับผู้ที่กำลังรักษาตัว ดูแลผู้ป่วยในบ้าน หรือขอให้ปีนี้ปราศจากโรคภัย
  intro: >-
    ปางที่คนนิยมมาไหว้เรื่องสุขภาพ มักเป็นปางที่ทรงถือน้ำทิพย์ โอสถ
    หรือภาชนะสำหรับประพรม ซึ่งในคติจีนหมายถึงการระงับทุกข์ทางกายให้เย็นลง
  keywords: [ขอพรกวนอิม สุขภาพ, กวนอิม หายป่วย, ไหว้กวนอิม ให้หายป่วย]
- id: children
  order: 2
  title: ขอบุตร · ครอบครัว
  short: ขอบุตร
  lede: สำหรับคู่สมรสที่รอคอยบุตร และผู้ที่ขอให้ครอบครัวอยู่เย็นเป็นสุข
  intro: >-
    "กวนอิมส่งบุตร" (送子觀音) เป็นคติที่แพร่หลายที่สุดคติหนึ่งในไทย
    ปางที่เกี่ยวข้องมักทรงอาภรณ์ขาวหรือประทับบนดอกบัว อันหมายถึงความบริสุทธิ์และการให้กำเนิด
  keywords: [กวนอิม ปางประทานบุตร, ขอลูกกวนอิม, กวนอิมส่งบุตร]
- id: career
  order: 3
  title: การงาน · การศึกษา
  short: การงาน
  lede: สำหรับผู้สอบ ผู้เริ่มงานใหม่ และผู้ที่ขอให้หน้าที่การงานมั่นคง
  intro: >-
    ปางที่ทรงถือคัมภีร์หรือทรงบารมีอย่างผู้ปกครอง เป็นปางที่ผู้ศึกษาและผู้ทำงาน
    นิยมมาขอพรเรื่องสติปัญญาและความก้าวหน้า
  keywords: [ขอพรกวนอิม การงาน, กวนอิม สอบติด, ไหว้กวนอิม เรื่องงาน]
- id: trade
  order: 4
  title: ค้าขาย · โชคลาภ
  short: ค้าขาย
  lede: สำหรับผู้ประกอบการ พ่อค้าแม่ค้า และผู้ที่ขอให้กิจการราบรื่น
  intro: >-
    ปางที่รายล้อมด้วยรัตนะหรือทรงถือตะกร้าปลา สื่อถึงความอุดมสมบูรณ์
    และการมีกินมีใช้ไม่ขาดมือ
  keywords: [ขอพรกวนอิม ค้าขาย, กวนอิม โชคลาภ, ไหว้กวนอิม ขายดี]
- id: love
  order: 5
  title: ความรัก · คู่ครอง
  short: ความรัก
  lede: สำหรับผู้ที่ขอให้พบคู่ที่ดี หรือขอให้ความสัมพันธ์ที่มีอยู่เข้าใจกันมากขึ้น
  intro: >-
    ในคติกวนอิม ความรักที่ขอกันไม่ใช่การผูกมัด แต่เป็นเมตตาที่ทำให้สองฝ่ายเข้าใจกัน
    ปางในหมวดนี้จึงเน้นความบริสุทธิ์และการละความยึดถือ
  keywords: [ขอพรกวนอิม ความรัก, กวนอิม ขอคู่, ไหว้กวนอิม เรื่องความรัก]
- id: travel
  order: 6
  title: เดินทางปลอดภัย
  short: เดินทาง
  lede: สำหรับผู้ที่ต้องเดินทางไกล ขับรถประจำ หรือทำงานกลางทะเล
  intro: >-
    ปางที่ประทับเหนือมังกร ใบบัว หรือทอดพระเนตรสาคร เป็นปางที่ผู้เดินเรือ
    และผู้เดินทางไกลกราบไหว้มาแต่โบราณ
  keywords: [ขอพรกวนอิม เดินทางปลอดภัย, กวนอิม คุ้มครองเดินทาง]
- id: protection
  order: 7
  title: คุ้มครอง · แคล้วคลาด
  short: คุ้มครอง
  lede: สำหรับผู้ที่ขอให้แคล้วคลาดจากภยันตราย คดีความ และผู้คิดร้าย
  intro: >-
    ปางในหมวดนี้คือปางที่แสดงเดชานุภาพ — ประทับเหนือราชสีห์ กลางวงรัศมีเพลิง
    หรือเหนือสายฟ้า อันหมายถึงการระงับภัยด้วยอำนาจแห่งเมตตา
  keywords: [ขอพรกวนอิม แคล้วคลาด, กวนอิม คุ้มครอง, ไหว้กวนอิม กันภัย]
- id: peace
  order: 8
  title: จิตใจสงบ · คลายทุกข์
  short: คลายทุกข์
  lede: สำหรับผู้ที่แบกความกังวล สูญเสียคนที่รัก หรืออยากหาที่สงบสักพัก
  intro: >-
    เป็นหมวดที่ตรงกับความหมายของพระนาม "กวนอิม" มากที่สุด — 觀世音
    คือผู้สดับเสียงร้องทุกข์ของโลก ปางในหมวดนี้จึงเน้นความสงบนิ่งมากกว่าอำนาจ
  keywords: [ขอพรกวนอิม คลายทุกข์, ไหว้กวนอิม ให้ใจสงบ, บทสวดกวนอิม คลายกังวล]
