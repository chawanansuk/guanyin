# 三十三觀音 — 中文欄位
# 中文名以匾額與經軌為準，已存於 src/content/pang/*.md 的 name_zh
# 此檔只存「辨識標記」與「本願要旨」的中文說明
#
# 「本願要旨」屬詮釋性說明，非經文原句 —— 與泰文版一致
# 譯自泰文原稿《เจ้าแม่กวนอิม ๓๓ ปาง》v3，尚待堂方校訂
- id: yang-liu
  marks: 細長柳枝，多持淨瓶
  essence: 傾聽鄉里苦難的慈悲，把眼前的紓解與長久的修心連在一起
- id: long-tou
  marks: 乘龍或立於龍上
  essence: 在慈悲引領下的力量，也是無法全然掌控的世間中的依止
- id: chi-jing
  marks: 手持經卷，多坐於磐石
  essence: 守住教法的本義，再把所知化為助人
- id: yuan-guang
  marks: 身後現圓形光輪
  essence: 讓人看見實相的光，不是使人目眩的光
- id: you-xi
  marks: 姿態閒適，不拘禮法
  essence: 不捨責任的自在，不耽於樂也不為苦所困
- id: bai-yi
  marks: 白衣覆頭及全身
  essence: 身處苦難之中，仍不失柔軟
- id: lian-wo
  marks: 坐臥於蓮華之上
  essence: 能安歇而不昏昧，出淤泥而不輕其根
- id: long-jian
  marks: 面向瀑布流水
  essence: 立於動勢旁的靜定，以及周全的傾聽
- id: shi-yao
  marks: 手作施予狀，多持藥器
  essence: 療癒始於看見眼前這個人，不只是給出物品
- id: yu-lan
  marks: 手提魚籃，作民間女子相
  essence: 以人間日常的語言走近眾生的慈悲
- id: de-wang
  marks: 端嚴而坐，配梵王身
  essence: 權力的價值，在於由德行決定方向
- id: shui-yue
  marks: 觀水中月影，作輪王坐
  essence: 見兩重真實，莊嚴而不必避世
- id: yi-ye
  marks: 乘一葉浮於水面
  essence: 安穩是相對的，微小之物亦能承載生命
- id: qing-jing
  marks: 頸現青色，經軌本作三面四臂
  essence: 甘願自受其毒，使毒不及於人
- id: wei-de
  marks: 持蓮華，坐於磐石
  essence: 不必動用兵刃的威德
- id: yan-ming
  marks: 曼荼羅本二十臂，圖像本倚石觀水
  essence: 長壽的意義，在於多出的日子成為助人的機會
- id: zhong-bao
  marks: 安坐，右手觸地
  essence: 一切財寶的價值，在於流向苦難的呼聲
- id: yan-hu
  marks: 坐於石窟之中
  essence: 不棄眾生的靜處，是能適應黑暗的眼睛
- id: neng-jing
  marks: 坐於磐石，面向大海
  essence: 作為回應之力的寂靜，而非抽身而退
- id: a-nou
  marks: 坐石遠望大海
  essence: 於波濤之中守住不熱惱
- id: a-mo-ti
  marks: 與獅子同座，或作四臂
  essence: 勇氣的力量，在於由慈悲引領
- id: ye-yi
  marks: 身著葉衣，經軌本四臂持斧與羂索
  essence: 護生涵蓋個人、群體與所處的環境
- id: liu-li
  marks: 蓮華浮水，手持香器
  essence: 明澈使慈悲不被偏見帶著走
- id: duo-luo
  marks: 女相而立，與雲相應
  essence: 見苦即起而行的慈悲
- id: ge-li
  marks: 現身於雙殼蛤蜊之中
  essence: 看見藏在自身欲求背後的苦
- id: liu-shi
  marks: 持經卷或承經之器
  essence: 讓慈悲成為每一日的一部分
- id: pu-bei
  marks: 衣袖覆手，身處山景
  essence: 不擋任何人於慈悲之外，但擇宜而助
- id: ma-lang-fu
  marks: 故事中的女子相，多持經卷或魚籃
  essence: 把執著轉為契入智慧的機緣
- id: he-zhang
  marks: 雙手合掌，多立於蓮上
  essence: 恭敬既現於儀態，也現於待人的實際
- id: yi-ru
  marks: 與雲相連，安住於雷雨之上
  essence: 把實況看清，再以慈悲回應
- id: bu-er
  marks: 蓮與水，安坐之姿
  essence: 有分辨的智慧，卻不執取彼此的界線
- id: chi-lian
  marks: 蓮花持於手中，非為台座
  essence: 以善待世間，不讓困厄限定生命的價值
- id: sa-shui
  marks: 淨瓶與灑水之姿
  essence: 以智慧所導的慈悲，傳遞清涼
